name: Build Unsigned IPA<br/><br/>on:<br/>  workflow_dispatch:<br/><br/>jobs:<br/>  build:<br/>    runs-on: macos-latest<br/><br/>    steps:<br/>    - name: Checkout code<br/>      uses: actions/checkout@v3<br/><br/>    - name: Set up Xcode<br/>      uses: maxim-lobanov/setup-xcode@v1<br/>      with:<br/>        xcode-version: latest-stable<br/><br/>    - name: Make script executable<br/>      run: chmod +x build_ipa.sh<br/><br/>    - name: Build IPA<br/>      run: ./build_ipa.sh<br/><br/>    - name: Upload IPA Artifact<br/>      uses: actions/upload-artifact@v3<br/>      with:<br/>        name: iOSVideoPlayer-GitHub-IPA<br/>        path: output/*.ipa
